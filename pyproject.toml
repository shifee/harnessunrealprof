[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unreal-codex-harness"
version = "0.1.0"
description = "Portable Unreal Editor JSON harness and project-local Codex skill"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "unreal-codex-harness contributors"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
unreal-harness = "unreal_harness.cli:main"

[project.optional-dependencies]
dev = ["build", "ruff"]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["unreal_harness*"]
