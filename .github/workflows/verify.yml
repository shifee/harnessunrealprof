name: Verify harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build ruff
      - run: python scripts/check_release.py --build --lint
      - name: Validate PowerShell launcher
        shell: pwsh
        run: |
          $parseErrors = $null
          $parseTokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'run.ps1'), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-${{ matrix.os }}-${{ matrix.python }}
          path: Saved/HarnessReadiness/host.json
